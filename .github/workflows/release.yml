name: Build dependency-free Windows release
on:
  workflow_dispatch:
  push:
    tags: ["v2.*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Test core and infrastructure
        run: dotnet test tests/PhotoManager.Tests/PhotoManager.Tests.csproj -c Release
      - name: Test WPF startup and bindings
        run: dotnet run --project tests/PhotoManager.Wpf.Smoke/PhotoManager.Wpf.Smoke.csproj -c Release
      - name: Publish self-contained executables
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Build x64 installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer-x64.iss'
      - name: Checksums
        shell: pwsh
        run: |
          $files = @(
            "artifacts/PhotoManager-2.0.0-win-x64-portable.zip",
            "artifacts/PhotoManager-2.0.0-win-arm64-portable.zip",
            "artifacts/installer/PhotoManager-Setup-2.0.0-win-x64.exe"
          )
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($file))" | Add-Content artifacts/checksum-sha256.txt -Encoding ascii
          }
      - uses: actions/upload-artifact@v5
        with:
          name: PhotoManager-2.0.0-Windows
          path: |
            artifacts/*portable.zip
            artifacts/installer/*.exe
            artifacts/checksum-sha256.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/*portable.zip
            artifacts/installer/*.exe
            artifacts/checksum-sha256.txt
