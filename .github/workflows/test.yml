name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore tests/PhotoManager.Tests/PhotoManager.Tests.csproj
      - run: dotnet test tests/PhotoManager.Tests/PhotoManager.Tests.csproj -c Release --no-restore
